<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>raudo</title>
  <style>
    :root { --fg: #1d1d1f; --muted: #6b6b70; --bg: #ffffff; --line: #e3e3e8; --accent: #2f6fde; --err: #c42b1c; --ok: #1b7f3b; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f2f2f5; --muted: #a0a0a8; --bg: #1f1f23; --line: #3a3a40; --accent: #6b9cff; --err: #ff7b6e; --ok: #5fd38a; }
    }
    body { font: 13px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; width: 360px; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    header img { width: 20px; height: 20px; }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #status { font-size: 12px; color: var(--muted); }
    #status.ok { color: var(--ok); } #status.err { color: var(--err); }
    section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    section:last-child { border-bottom: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 6px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
    li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
    button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    select { font: inherit; flex: 1; min-width: 0; padding: 3px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
    .empty, .hint { color: var(--muted); }
    #msg { font-size: 12px; margin-top: 6px; min-height: 1em; }
    #msg.err { color: var(--err); } #msg.ok { color: var(--ok); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icons/32.png" alt="">
    <h1>raudo</h1>
    <span id="status">conectando…</span>
  </header>

  <section id="permission" hidden>
    <p class="hint">raudo necesita acceso a las webs para detectar vídeos y descargas.</p>
    <button id="grant" class="primary">Conceder acceso</button>
  </section>

  <section id="page">
    <h2>Vídeo de esta página</h2>
    <div class="row">
      <button id="page-best" class="primary">Descargar (mejor calidad)</button>
      <button id="page-formats">Elegir calidad…</button>
    </div>
    <div class="row" id="formats-row" hidden style="margin-top:6px">
      <select id="formats"></select>
      <button id="formats-go" class="primary">Descargar</button>
    </div>
    <p class="hint" id="page-hint" hidden>Usa yt-dlp: funciona en YouTube y cientos de webs.</p>
  </section>

  <section>
    <h2>Medios detectados</h2>
    <ul id="media"></ul>
    <p class="empty" id="media-empty">Nada detectado todavía. Reproduce el vídeo y vuelve a abrir.</p>
  </section>

  <section>
    <div id="msg"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
