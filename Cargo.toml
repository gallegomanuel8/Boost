[workspace]
resolver = "2"
members = [
    "crates/raudo-proto",
    "crates/raudo-core",
    "crates/raudo-ipc",
    "crates/raudo-service",
    "crates/raudo-daemon",
    "crates/raudo-cli",
    "crates/raudo-nmhost",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "process", "io-util", "io-std", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
raudo-proto = { path = "crates/raudo-proto" }
raudo-core = { path = "crates/raudo-core" }
raudo-ipc = { path = "crates/raudo-ipc" }
raudo-service = { path = "crates/raudo-service" }
